<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Livros - BiblioTec</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        .container-livros {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .formulario {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .btn-voltar {
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 10px;
            text-align: left;
        }

        #mensagem {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        .sucesso {
            color: green;
        }

        .erro-geral {
            color: red;
        }
    </style>
</head>
<body>

<div class="container-livros">

    <div class="formulario">
        <h1>Gerenciar Livros</h1>

        <input type="hidden" id="idLivro">
        <input type="hidden" id="disponivelLivro">

        <input type="text" id="titulo" placeholder="Título">
        <div id="erroTitulo" class="erro"></div>

        <input type="text" id="autor" placeholder="Autor">
        <div id="erroAutor" class="erro"></div>

        <input type="text" id="editora" placeholder="Editora">
        <div id="erroEditora" class="erro"></div>

        <button id="btnCadastrar" onclick="cadastrarLivro()">
            Cadastrar Livro
        </button>

        <button id="btnAlterar" onclick="alterarLivro()" style="display:none;">
            Alterar Livro
        </button>

        <button onclick="limparFormulario()">
            Limpar
        </button>

        <hr>

        <input type="text" id="buscaLivro" placeholder="Pesquisar livro">

        <select id="tipoBusca">
            <option value="titulo">Título</option>
            <option value="autor">Autor</option>
            <option value="editora">Editora</option>
        </select>

        <button onclick="buscarLivro()">Buscar</button>
        <button onclick="listarLivros()">Listar Todos</button>
        <button onclick="listarDisponiveis()">Livros Disponíveis</button>
        <button onclick="listarEmprestados()">Livros Emprestados</button>

        <button class="btn-voltar" onclick="window.location.href='/dashboard.html'">
            Voltar
        </button>

        <div id="mensagem"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Autor</th>
                <th>Editora</th>
                <th>Disponível</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaLivros"></tbody>
    </table>

</div>

<script>

const API = "http://localhost:8082/livros";

window.onload = listarLivros;

function limparErros() {
    document.getElementById("erroTitulo").innerText = "";
    document.getElementById("erroAutor").innerText = "";
    document.getElementById("erroEditora").innerText = "";
}

function mostrarMensagem(texto, tipo) {
    const mensagem = document.getElementById("mensagem");
    mensagem.innerText = texto;
    mensagem.className = tipo;
}

function validarCampos() {
    limparErros();

    const titulo = document.getElementById("titulo").value.trim();
    const autor = document.getElementById("autor").value.trim();
    const editora = document.getElementById("editora").value.trim();

    let possuiErro = false;

    if (!titulo) {
        document.getElementById("erroTitulo").innerText = "Título é obrigatório.";
        possuiErro = true;
    }

    if (!autor) {
        document.getElementById("erroAutor").innerText = "Autor é obrigatório.";
        possuiErro = true;
    }

    if (!editora) {
        document.getElementById("erroEditora").innerText = "Editora é obrigatória.";
        possuiErro = true;
    }

    return !possuiErro;
}

function cadastrarLivro() {
    mostrarMensagem("", "");

    if (!validarCampos()) {
        return;
    }

    const titulo = document.getElementById("titulo").value.trim();
    const autor = document.getElementById("autor").value.trim();
    const editora = document.getElementById("editora").value.trim();

    fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            titulo: titulo,
            autor: autor,
            editora: editora,
            disponivel: true
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Erro ao cadastrar livro.");
        }
        return response.json();
    })
    .then(() => {
        limparFormulario();
        mostrarMensagem("Livro cadastrado com sucesso.", "sucesso");
        listarLivros();
    })
    .catch(() => {
        mostrarMensagem("Erro ao cadastrar livro.", "erro-geral");
    });
}

function prepararEdicao(id, titulo, autor, editora, disponivel) {
    document.getElementById("idLivro").value = id;
    document.getElementById("titulo").value = titulo;
    document.getElementById("autor").value = autor;
    document.getElementById("editora").value = editora;
    document.getElementById("disponivelLivro").value = disponivel;

    document.getElementById("btnCadastrar").style.display = "none";
    document.getElementById("btnAlterar").style.display = "inline-block";

    limparErros();
    mostrarMensagem("", "");
}

function alterarLivro() {
    mostrarMensagem("", "");

    if (!validarCampos()) {
        return;
    }

    const id = document.getElementById("idLivro").value;
    const titulo = document.getElementById("titulo").value.trim();
    const autor = document.getElementById("autor").value.trim();
    const editora = document.getElementById("editora").value.trim();
    const disponivel = document.getElementById("disponivelLivro").value === "true";

    fetch(API + "/" + id, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            titulo: titulo,
            autor: autor,
            editora: editora,
            disponivel: disponivel
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Erro ao alterar livro.");
        }
        return response.json();
    })
    .then(() => {
        limparFormulario();
        mostrarMensagem("Livro alterado com sucesso.", "sucesso");
        listarLivros();
    })
    .catch(() => {
        mostrarMensagem("Erro ao alterar livro.", "erro-geral");
    });
}

function excluirLivro(id) {
    if (!confirm("Deseja excluir este livro?")) {
        return;
    }

    fetch(API + "/" + id, {
        method: "DELETE"
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Erro ao excluir livro.");
        }
    })
    .then(() => {
        limparFormulario();
        mostrarMensagem("Livro excluído com sucesso.", "sucesso");
        listarLivros();
    })
    .catch(() => {
        mostrarMensagem("Erro ao excluir livro.", "erro-geral");
    });
}

function buscarLivro() {
    const texto = document.getElementById("buscaLivro").value.trim();
    const tipo = document.getElementById("tipoBusca").value;

    if (!texto) {
        listarLivros();
        return;
    }

    fetch(API + "/buscar/" + tipo + "?" + tipo + "=" + encodeURIComponent(texto))
        .then(response => {
            if (!response.ok) {
                let mensagem = "";

                if (tipo === "titulo") {
                    mensagem = "Livro não encontrado.";
                } else if (tipo === "autor") {
                    mensagem = "Autor não encontrado.";
                } else if (tipo === "editora") {
                    mensagem = "Editora não encontrada.";
                }

                montarMensagemNaoEncontrado(mensagem);
                return;
            }

            return response.json();
        })
        .then(livros => {
            if (livros) {
                montarTabela(livros);
            }
        });
}

function listarLivros() {
    fetch(API)
        .then(response => response.json())
        .then(dados => {
            dados.sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));
            montarTabela(dados);
        });
}

function listarDisponiveis() {
    fetch(API + "/disponiveis")
        .then(response => response.json())
        .then(dados => {
            dados.sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));
            montarTabela(dados);
        });
}

function listarEmprestados() {
    fetch(API + "/emprestados")
        .then(response => response.json())
        .then(dados => {
            dados.sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));
            montarTabela(dados);
        });
}

function montarTabela(livros) {
    const tabela = document.getElementById("tabelaLivros");
    tabela.innerHTML = "";

    livros.forEach(livro => {
        tabela.innerHTML += `
            <tr>
                <td>${livro.id}</td>
                <td>${livro.titulo}</td>
                <td>${livro.autor}</td>
                <td>${livro.editora}</td>
                <td>${livro.disponivel ? 'Sim' : 'Não'}</td>
                <td>
                    <button onclick="prepararEdicao(
                        ${livro.id},
                        '${livro.titulo}',
                        '${livro.autor}',
                        '${livro.editora}',
                        ${livro.disponivel}
                    )">
                        Editar
                    </button>

                    <button onclick="excluirLivro(${livro.id})">
                        Excluir
                    </button>
                </td>
            </tr>
        `;
    });
}

function montarMensagemNaoEncontrado(mensagem) {
    const tabela = document.getElementById("tabelaLivros");

    tabela.innerHTML = `
        <tr>
            <td colspan="6" style="color: red; font-weight: bold;">
                ${mensagem}
            </td>
        </tr>
    `;
}

function limparFormulario() {
    document.getElementById("idLivro").value = "";
    document.getElementById("titulo").value = "";
    document.getElementById("autor").value = "";
    document.getElementById("editora").value = "";
    document.getElementById("disponivelLivro").value = "";

    document.getElementById("btnCadastrar").style.display = "inline-block";
    document.getElementById("btnAlterar").style.display = "none";

    limparErros();
}

</script>

</body>
</html>
