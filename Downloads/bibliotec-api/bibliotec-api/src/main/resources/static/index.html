<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTec</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            max-width: 600px;
        }

        .logo {
            width: 220px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: white;
            color: #0d47a1;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .utfpr {
            margin-top: 25px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Coloque sua logo aqui -->
        <img src="logo-BiblioTec.png" alt="BiblioTec" class="logo">

        <h1>BiblioTec</h1>

        <p>
            Sistema de Gerenciamento de Biblioteca desenvolvido
            para a disciplina de Programação Orientada a Objetos II.
        </p>

        <a href="login.html" class="btn">
            Entrar no Sistema
        </a>

        <div class="utfpr">
            Engenharia de Software • UTFPR
        </div>

    </div>

</body>
</html>
