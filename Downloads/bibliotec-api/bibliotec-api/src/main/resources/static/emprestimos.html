<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos - BiblioTec</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/emprestimos.css">
</head>
<body>

<div class="container-emprestimos">

    <div class="formulario">

        <h1>Gerenciar Empréstimos</h1>

        <input type="number"
               id="usuarioId"
               placeholder="ID do Usuário"
               min="1">
        <div id="erroUsuario" class="erro"></div>

        <input type="number"
               id="livroId"
               placeholder="ID do Livro"
               min="1">
        <div id="erroLivro" class="erro"></div>

        <button onclick="realizarEmprestimo()">
            Realizar Empréstimo
        </button>

        <button onclick="listarEmprestimos()">
            Empréstimos em Aberto
        </button>

        <button onclick="window.location.href='/dashboard.html'">
            Voltar
        </button>
    
        <div id="mensagem"></div>

    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Usuário</th>
            <th>Livro</th>
            <th>Data Empréstimo</th>
            <th>Ação</th>
        </tr>
        </thead>

        <tbody id="tabelaEmprestimos"></tbody>
    </table>

</div>

<script src="/js/emprestimos.js"></script>

</body>
</html>
