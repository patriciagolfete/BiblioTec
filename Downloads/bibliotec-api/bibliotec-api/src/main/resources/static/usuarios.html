<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários - BiblioTec</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #3498db;
            color: white;
        }

        .container-usuarios {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .formulario {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .erro {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 10px;
            text-align: left;
        }

        #mensagem {
            margin-top: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container-usuarios">

    <div class="formulario">

        <h1>Gerenciar Usuários</h1>

        <input type="hidden" id="idUsuario">

        <input type="text" id="nome" placeholder="Nome">
        <div id="erroNome" class="erro"></div>

        <input type="email" id="email" placeholder="Email">
        <div id="erroEmail" class="erro"></div>

        <div id="mensagem"></div>

        <button id="btnCadastrar" onclick="cadastrarUsuario()">
            Cadastrar Usuário
        </button>

        <button id="btnAlterar" onclick="alterarUsuario()" style="display:none;">
            Alterar Usuário
        </button>

        <button onclick="limparFormulario()">
            Limpar
        </button>

        <hr>

        <input type="text" id="buscaNome" placeholder="Buscar por nome">

        <button onclick="buscarUsuario()">Buscar</button>

        <button onclick="listarUsuarios()">Listar Todos</button>

        <button onclick="window.location.href='/dashboard.html'">
            Voltar
        </button>

    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody id="tabelaUsuarios"></tbody>
    </table>

</div>

<script>

const API = "http://localhost:8082/usuarios";

window.onload = listarUsuarios;

function limparErros() {
    document.getElementById("erroNome").innerText = "";
    document.getElementById("erroEmail").innerText = "";
}

function mostrarMensagem(texto, sucesso = true) {
    const mensagem = document.getElementById("mensagem");

    mensagem.innerText = texto;
    mensagem.style.color = sucesso ? "green" : "red";
    mensagem.style.fontWeight = "bold";
}

function validarCampos() {

    limparErros();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();

    let possuiErro = false;

    if (!nome) {
        document.getElementById("erroNome").innerText =
            "Nome é obrigatório.";
        possuiErro = true;
    } else if (!/^[A-Za-zÀ-ÿ\s]+$/.test(nome)) {
        document.getElementById("erroNome").innerText =
            "Nome não pode conter números.";
        possuiErro = true;
    }

    if (!email) {
        document.getElementById("erroEmail").innerText =
            "Email é obrigatório.";
        possuiErro = true;
    }

    return !possuiErro;
}

function cadastrarUsuario() {

    mostrarMensagem("");

    if (!validarCampos()) {
        return;
    }

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();

    fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            nome: nome,
            email: email,
            qntEmprestimos: 0
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Erro ao cadastrar usuário.");
        }

        return response.json();
    })
    .then(() => {
        limparFormulario();
        mostrarMensagem("Usuário cadastrado com sucesso!", true);
        listarUsuarios();
    })
    .catch(() => {
        document.getElementById("erroEmail").innerText =
            "Já existe um usuário com este e-mail.";
    });
}

function prepararEdicao(id, nome, email) {

    document.getElementById("idUsuario").value = id;
    document.getElementById("nome").value = nome;
    document.getElementById("email").value = email;

    document.getElementById("btnCadastrar").style.display = "none";
    document.getElementById("btnAlterar").style.display = "inline-block";

    mostrarMensagem("");
    limparErros();
}

function alterarUsuario() {

    mostrarMensagem("");

    if (!validarCampos()) {
        return;
    }

    const id = document.getElementById("idUsuario").value;
    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();

    fetch(API + "/" + id, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            nome: nome,
            email: email,
            qntEmprestimos: 0
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Erro ao alterar usuário.");
        }

        return response.json();
    })
    .then(() => {
        limparFormulario();
        mostrarMensagem("Usuário alterado com sucesso!", true);
        listarUsuarios();
    })
    .catch(() => {
        mostrarMensagem("Erro ao alterar usuário.", false);
    });
}

function excluirUsuario(id) {

    if (!confirm("Deseja excluir este usuário?")) {
        return;
    }

    fetch(API + "/" + id, {
        method: "DELETE"
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Erro ao excluir usuário.");
        }
    })
    .then(() => {
        limparFormulario();
        mostrarMensagem("Usuário excluído com sucesso!", true);
        listarUsuarios();
    })
    .catch(() => {
        mostrarMensagem("Erro ao excluir usuário.", false);
    });
}

function listarUsuarios() {

    fetch(API)
        .then(response => response.json())
        .then(usuarios => montarTabela(usuarios));
}

function buscarUsuario() {

    const nome = document.getElementById("buscaNome").value.trim();

    if (!nome) {
        listarUsuarios();
        return;
    }

    fetch(API + "/buscar?nome=" + encodeURIComponent(nome))
        .then(response => {

            if (!response.ok) {
                montarMensagemNaoEncontrado("Usuário não encontrado.");
                return;
            }

            return response.json();
        })
        .then(usuarios => {
            if (usuarios) {
                montarTabela(usuarios);
            }
        });
}

function montarMensagemNaoEncontrado(mensagem) {

    const tabela = document.getElementById("tabelaUsuarios");

    tabela.innerHTML = `
        <tr>
            <td colspan="4" style="color: red; font-weight: bold;">
                ${mensagem}
            </td>
        </tr>
    `;
}

function montarTabela(usuarios) {

    const tabela = document.getElementById("tabelaUsuarios");

    tabela.innerHTML = "";

    usuarios.forEach(usuario => {

        tabela.innerHTML += `
            <tr>
                <td>${usuario.id}</td>
                <td>${usuario.nome}</td>
                <td>${usuario.email}</td>
                <td>
                    <button onclick="prepararEdicao(${usuario.id}, '${usuario.nome}', '${usuario.email}')">
                        Editar
                    </button>

                    <button onclick="excluirUsuario(${usuario.id})">
                        Excluir
                    </button>
                </td>
            </tr>
        `;
    });
}

function limparFormulario() {

    document.getElementById("idUsuario").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("email").value = "";

    document.getElementById("btnCadastrar").style.display = "inline-block";
    document.getElementById("btnAlterar").style.display = "none";

    limparErros();
}

</script>

</body>
</html>
