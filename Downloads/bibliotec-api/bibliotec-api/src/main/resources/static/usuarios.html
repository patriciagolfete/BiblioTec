<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários - BiblioTec</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #3498db;
            color: white;
        }

        .container-usuarios {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .formulario {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .acoes {
            margin-top: 10px;
        }
        
        .erro {
        color: red;
        font-size: 14px;
        margin-top: 5px;
        margin-bottom: 10px;
        text-align: left;
        }
        
    </style>
</head>
<body>

<div class="container-usuarios">

    <div class="formulario">

        <h1>Gerenciar Usuários</h1>

        <input type="text"
               id="nome"
               placeholder="Nome">
        <div id="erroNome" class="erro"></div>

        <input type="email"
               id="email"
               placeholder="Email">
        <div id="erroEmail" class="erro"></div>

        <button onclick="cadastrarUsuario()">
            Cadastrar Usuário
        </button>

        <hr>

        <input type="text"
               id="buscaNome"
               placeholder="Buscar por nome">

        <button onclick="buscarUsuario()">
            Buscar
        </button>

        <button onclick="listarUsuarios()">
            Listar Todos
        </button>

        <button onclick="window.location.href='/dashboard.html'">
            Voltar
        </button>

    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
        </tr>
        </thead>

        <tbody id="tabelaUsuarios"></tbody>

    </table>

</div>

<script>

const API = "http://localhost:8082/usuarios";

window.onload = listarUsuarios;

function limparErros() {
    document.getElementById("erroNome").innerText = "";
    document.getElementById("erroEmail").innerText = "";
}

function cadastrarUsuario() {

    limparErros();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();

    let possuiErro = false;

    // Validação do nome
    if (!nome) {
        document.getElementById("erroNome").innerText =
            "Nome é obrigatório.";
        possuiErro = true;
    }
    else if (!/^[A-Za-zÀ-ÿ\s]+$/.test(nome)) {
        document.getElementById("erroNome").innerText =
            "Nome não pode conter números.";
        possuiErro = true;
    }

    // Validação do email
    if (!email) {
        document.getElementById("erroEmail").innerText =
            "Email é obrigatório.";
        possuiErro = true;
    }

    // Se houver erro, não envia para a API
    if (possuiErro) {
        return;
    }

    fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            nome: nome,
            email: email
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Erro ao cadastrar usuário.");
        }

        return response.json();
    })
    .then(() => {
        document.getElementById("nome").value = "";
        document.getElementById("email").value = "";

        listarUsuarios();
    })
    .catch(error => {
        console.error(error);
    });
}

function listarUsuarios() {

    fetch(API)
        .then(response => response.json())
        .then(usuarios => montarTabela(usuarios));
}

function buscarUsuario() {

    const nome = document.getElementById("buscaNome").value;

    fetch(API + "/buscar?nome=" + encodeURIComponent(nome))
        .then(response => response.json())
        .then(usuarios => montarTabela(usuarios));
}

function montarTabela(usuarios) {

    const tabela = document.getElementById("tabelaUsuarios");

    tabela.innerHTML = "";

    usuarios.forEach(usuario => {

        tabela.innerHTML += `
            <tr>
                <td>${usuario.id}</td>
                <td>${usuario.nome}</td>
                <td>${usuario.email}</td>
            </tr>
        `;
    });
}

</script>

</body>
</html>
