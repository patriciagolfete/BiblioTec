<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários - BiblioTec</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/usuarios.css">
</head>
<body>

<div class="container-usuarios">

    <div class="formulario">

        <h1>Gerenciar Usuários</h1>

        <input type="hidden" id="idUsuario">

        <input type="text" id="nome" placeholder="Nome">
        <div id="erroNome" class="erro"></div>

        <input type="email" id="email" placeholder="Email">
        <div id="erroEmail" class="erro"></div>

        <div id="mensagem"></div>

        <button id="btnCadastrar" onclick="cadastrarUsuario()">
            Cadastrar Usuário
        </button>

        <button id="btnAlterar" onclick="alterarUsuario()" style="display:none;">
            Alterar Usuário
        </button>

        <button onclick="limparFormulario()">
            Limpar
        </button>

        <hr>

        <input type="text" id="buscaNome" placeholder="Buscar por nome">

        <button onclick="buscarUsuario()">Buscar</button>

        <button onclick="listarUsuarios()">Listar Todos</button>

        <button onclick="window.location.href='/dashboard.html'">
            Voltar
        </button>

    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody id="tabelaUsuarios"></tbody>
    </table>

</div>

<script src="/js/usuarios.js"></script>

</body>
</html>
